# ============ 挑战规则（无胜利点，动态出局线保护，自动连续轮次） ============
[challenge]
initial_balance = 0          # 0=auto：实盘启动/每轮自动从 OKX 实际余额起算；纸盘/回测必须 >0
base_drawdown_pct = 30       # 起步（1.0x）回撤容忍：权益从峰值回撤 30% 结束本轮
tight_drawdown_pct = 10      # 盈利 ≥2x 后收紧到 10%：深盈利最多回吐 10% 就锁利
tight_start_multiple = 1.5   # 容忍率从 1x→30% 线性收紧到该倍数→10%（约 1.25x 起出局线高于本金）
duration_hours = 0           # 可选单轮时长上限；0 = 不限时
timeframe = "15m"            # 策略 K 线周期（ma_macd 体系：15m 信号 + 1H 生命线）

# ============ 交易所 ============
[exchange]
symbol = "ETH/USDT:USDT"    # ccxt 符号（OKX ETH 永续）
mode = "paper"              # paper=纸盘(本地撮合) | live=实盘(真实下单)
feed = "auto"               # ws=WebSocket | rest=REST轮询 | auto=先WS收不到行情自动降级REST（本地代理推荐auto）
proxy = "http://127.0.0.1:10808"  # 开发机走本地代理；VPS 直连请留空 ""
fetch_fees_from_okx = true  # 启动时从 OKX 拉取实际费率（需 API key），失败则用默认 0.05%/0.02%
taker_fee = 0.0005          # 默认费率（仅当 fetch_fees_from_okx=false 或拉取失败时使用）
maker_fee = 0.0002

# ============ 风控 ============
[risk]
leverage = 5                # 开仓杠杆（杠杆敏感性研究：5x 最优，10x 起单调变差）
margin_per_trade = 5        # 单笔占用保证金 USDT（136 首层需 ≥ 最小 0.01 张，勿低于 5U@20U）
max_notional = 1000         # 单仓名义价值上限 USDT（20u 账户的保护线）
slippage_bps = 1.0          # 回测/纸盘市价单滑点（bps），纸盘实际成交价以盘口深度为准
liquidation_buffer = 0.05   # 强平价缓冲（5%，即达到强平价前强制离场，防误差）

# ============ 策略（唯一内置：ma_macd，旧策略族已删） ============
[strategy]
name = "ma_macd"             # MA+MACD 两情相悦 × 1H 生命线 × 四位置 × 136 分仓 × 锁利离场
[strategy.params]
# 以下全部有默认值，通常无需配置；可调参数与含义见 app/strategy.py MaMacd 文档串
# 常用实验开关：confirm(second/any)、vol_spike_mult、vol_exit_opposite、
#               div_filter、d1_enable、zone_mult、stop_atr_mult、trail_atr_mult
[storage]
db_path = "data/bot.db"

[log]
level = "INFO"

# ============ API ============
[api]
host = "127.0.0.1"          # 看板只绑本机；对外用 caddy 反代 + Basic Auth
port = 8000
