<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yuncs · ETH-USDT-SWAP</title>
<script src="echarts.min.js"></script>
<style>
  /* OKX 白天风格：白底浅灰卡片，常规系统字体，手机优先 */
  :root{
    --bg:#f7f8fa; --card:#ffffff; --line:#e8ebf0; --line2:#d8dde5;
    --tx:#16181d; --dim:#6b7280; --faint:#9aa3af;
    --green:#00b578; --red:#f6483d; --amber:#ffb400; --blue:#165dff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif}
  .num{font-variant-numeric:tabular-nums}

  /* 顶栏：信息紧凑，价格突出 */
  .hdr{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px 8px}
  .hdr1{display:flex;align-items:center;gap:8px}
  .sym{font-weight:700;font-size:15px}
  .sym small{color:var(--faint);font-weight:400;font-size:12px;margin-left:4px}
  .state{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);background:#f2f3f5;padding:2px 9px;border-radius:99px}
  .state .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .state.run .dot{background:var(--green)}
  .pxrow{display:flex;align-items:baseline;gap:10px;margin-top:4px;flex-wrap:wrap}
  .px{font-size:30px;font-weight:700;line-height:1.2}
  .px.g{color:var(--green)}.px.r{color:var(--red)}
  .meta{color:var(--dim);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}

  main{padding:10px 12px 40px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .card h3{font-size:12px;color:var(--faint);font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .card h3 .r{margin-left:auto;color:var(--dim)}

  .eq{font-size:26px;font-weight:700}
  .mult{display:inline-block;font-size:13px;font-weight:600;padding:1px 8px;border-radius:6px;margin-left:6px;vertical-align:2px}
  .mult.up{color:var(--green);background:rgba(0,181,120,.1)}
  .mult.down{color:var(--red);background:rgba(246,72,61,.1)}

  .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px}
  .kv>div{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:5px;border-bottom:1px dashed var(--line)}
  .kv .k{color:var(--dim);font-size:13px}
  .kv .v{font-weight:600}
  .g{color:var(--green)}.r{color:var(--red)}.y{color:var(--amber)}.dim{color:var(--dim)}.faint{color:var(--faint)}

  .meter{height:8px;background:#eef0f3;border-radius:5px;overflow:hidden;margin:10px 0 2px}
  .meter>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:5px;transition:width .4s}
  .meterlbl{display:flex;justify-content:space-between;color:var(--faint);font-size:12px;margin-top:3px}

  #chart{height:240px;width:100%}
  .empty{color:var(--faint);display:flex;align-items:center;justify-content:center;height:100%;font-size:13px}

  .tabs{display:flex;gap:2px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  .tabs button{background:none;border:none;font-size:14px;color:var(--dim);padding:6px 14px;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--tx);font-weight:600;border-color:var(--blue)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--faint);font-weight:400;text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:7px 4px;text-align:right;border-bottom:1px solid #f0f2f5}
  tr:last-child td{border-bottom:none}
  .side{padding:0 6px;border-radius:4px;font-weight:600;font-size:12px}
  .side.long{color:var(--green);background:rgba(0,181,120,.1)}
  .side.short{color:var(--red);background:rgba(246,72,61,.1)}
  .rows div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f2f5;font-size:14px}
  .rows div:last-child{border-bottom:none}
  .rows .k{color:var(--dim)}
  .rows .v{font-weight:600}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr1">
    <span class="sym">yuncs <small>ETH-USDT-SWAP 永续</small></span>
    <span class="state" id="state"><span class="dot"></span><span id="stateTxt">-</span></span>
    <span class="state" id="round">第 - 轮</span>
    <span class="state" id="feed">-</span>
  </div>
  <div class="pxrow">
    <span class="px num" id="px">-</span>
    <span class="meta num"><span id="pxsub">-</span></span>
  </div>
</div>

<main>
  <div class="card">
    <h3>当前轮 <span class="r" id="result"></span></h3>
    <div><span class="eq num" id="kEquity">-</span><span class="mult" id="kMult">-</span></div>
    <div class="meter"><div id="meter" style="width:0%"></div></div>
    <div class="meterlbl"><span id="meterL">-</span><span id="meterR">-</span></div>
    <div class="kv">
      <div><span class="k">出局线</span><span class="v num r" id="kGuard">-</span></div>
      <div><span class="k">峰值</span><span class="v num" id="kPeak">-</span></div>
      <div><span class="k">回撤</span><span class="v num" id="kDD">-</span></div>
      <div><span class="k">容忍</span><span class="v num" id="kTol">-</span></div>
      <div><span class="k">初始</span><span class="v num" id="kInit">-</span></div>
      <div><span class="k">距出局线</span><span class="v num" id="kRoom">-</span></div>
    </div>
  </div>

  <div class="card">
    <h3>权益曲线</h3>
    <div id="chart"><div class="empty">加载中…</div></div>
  </div>

  <div class="card">
    <div class="tabs">
      <button id="tabTrades" class="on" onclick="showTab('trades')">成交</button>
      <button id="tabRuns" onclick="showTab('runs')">轮次</button>
    </div>
    <div id="tradesBox"><table><thead><tr><th>时间</th><th>方向</th><th>数量</th><th>开/平</th><th>盈亏</th></tr></thead><tbody></tbody></table></div>
    <div id="runsBox" style="display:none"><table><thead><tr><th>#</th><th>模式</th><th>结束倍数</th><th>状态</th></tr></thead><tbody></tbody></table></div>
  </div>

  <div class="card">
    <h3>持仓</h3>
    <div style="font-size:19px;font-weight:700;margin-bottom:4px" id="posSide">空仓</div>
    <div class="rows">
      <div><span class="k">数量 / 名义</span><span class="v num" id="pSize">-</span></div>
      <div><span class="k">开仓价 / 成本价</span><span class="v num" id="pEntry">-</span></div>
      <div><span class="k">强平价</span><span class="v num r" id="pLiq">-</span></div>
      <div><span class="k">保证金</span><span class="v num" id="pMargin">-</span></div>
      <div><span class="k">未实现盈亏</span><span class="v num" id="pUpl">-</span></div>
    </div>
  </div>

  <div class="card">
    <h3>钱包 <span class="r">初始 <span class="num" id="wInit">-</span></span></h3>
    <div class="rows">
      <div><span class="k">可用余额</span><span class="v num" id="wBal">-</span></div>
      <div><span class="k">已实现盈亏</span><span class="v num" id="wPnl">-</span></div>
      <div><span class="k">手续费 / 资金费</span><span class="v num" id="wFees">-</span></div>
      <div><span class="k">可买</span><span class="v num" id="wBuyable">-</span></div>
    </div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const num=(v,d=2)=>(v==null||isNaN(v))?'-':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(v,d=2)=>(v==null)?'-':(v>0?'+':'')+Number(v).toFixed(d);
const c3=v=>v>0?'g':v<0?'r':'';
const fmtTs=t=>{const x=new Date(t*1000),p=n=>String(n).padStart(2,'0');return p(x.getHours())+':'+p(x.getMinutes())};

let chart=null,lastPx=0,lastTs=0,initial=0,guard=0,peak=0;

function initChart(){
  if(typeof echarts==='undefined')throw new Error('no echarts');
  chart=echarts.init($('chart'));
  chart.setOption({
    animation:false,
    grid:{left:8,right:8,top:14,bottom:24,containLabel:true},
    xAxis:{type:'time',axisLine:{lineStyle:{color:'#e8ebf0'}},axisLabel:{color:'#9aa3af'},splitLine:{show:false}},
    yAxis:{type:'value',scale:true,axisLabel:{color:'#9aa3af'},splitLine:{lineStyle:{color:'#f0f2f5'}}},
    tooltip:{trigger:'axis',valueFormatter:v=>v==null?'-':Number(v).toFixed(2)},
    series:[{type:'line',showSymbol:false,smooth:true,lineStyle:{width:2,color:'#00b578'},
      itemStyle:{color:'#00b578'},areaStyle:{color:'rgba(0,181,120,.08)'},data:[]}]
  });
}
function drawMarkLines(){
  if(!chart)return;
  const gl=[];
  if(initial>0)gl.push({yAxis:initial,lineStyle:{color:'#9aa3af',width:1,type:'dotted'},label:{formatter:'初始',color:'#9aa3af',fontSize:10}});
  if(guard>0)gl.push({yAxis:guard,lineStyle:{color:'#f6483d',width:1,type:'dashed'},label:{formatter:'出局线',color:'#f6483d',fontSize:10}});
  chart.setOption({series:[{markLine:{symbol:'none',silent:true,data:gl}}]});
}
function push(ts,eq){
  if(ts===lastTs)return; lastTs=ts;
  if(!chart)return;
  chart.setOption({series:[{data:chart.getOption().series[0].data.concat([[ts*1000,eq]]).slice(-3000)}]},{lazyUpdate:true});
  drawMarkLines();
}

function render(s){
  if(!s)return;
  const c=s.challenge||{};
  initial=c.initial_balance||initial; guard=c.guard_level||guard; peak=c.peak_equity||peak;

  $('stateTxt').textContent=((s.mode||'')==='live'?'实盘':'纸盘')+' · '+({running:'运行中',guard:'结束',timeout:'超时',stopped:'已停止'}[c.status]||'');
  $('state').className='state '+((c.status==='running'||!c.status)?'run':'');
  $('round').textContent='第 '+(c.round||'-')+' 轮';
  $('feed').textContent=s.feed_mode==='ws'?'WS':'REST';
  $('result').textContent=c.result||'';
  $('px').textContent=num(s.price,2);
  $('px').className='px num '+(s.price>lastPx?'g':s.price<lastPx?'r':'');
  lastPx=s.price;
  $('pxsub').textContent=`B ${num(s.bid)} / A ${num(s.ask)} · 资金费 ${((s.funding_rate||0)*100).toFixed(4)}%`;

  const up=(c.equity||0)>=(initial||0);
  $('kEquity').textContent=num(c.equity,2)+' U';
  $('kMult').textContent=num(c.multiple,2)+'x';
  $('kMult').className='mult '+(up?'up':'down');
  $('kGuard').textContent=num(guard,2);
  $('kPeak').textContent=num(peak,2);
  $('kDD').textContent=num(c.drawdown_pct,2)+'%';
  $('kDD').className='v num '+((c.drawdown_pct||0)>(c.tolerance_pct||30)*0.7?'y':'');
  $('kTol').textContent=num(c.tolerance_pct,1)+'%';
  $('kInit').textContent=num(initial,2);
  $('kRoom').textContent=num((c.equity||0)-guard,2);
  const room=(guard&&peak>guard)?Math.max(0,Math.min(100,(c.equity-guard)/(peak-guard)*100)):0;
  $('meter').style.width=room+'%';
  $('meterL').textContent='安全空间 '+num((c.equity||0)-guard,2)+' U';
  $('meterR').textContent='峰值 '+num(peak,2);

  const p=s.position||{},side=p.side||'flat';
  $('posSide').textContent=side==='long'?'多仓 ▲':side==='short'?'空仓 ▼':'空仓';
  $('posSide').style.color=side==='long'?'var(--green)':side==='short'?'var(--red)':'var(--faint)';
  $('pSize').textContent=(p.size_eth?num(p.size_eth,4)+' ETH':'无')+' / '+num(p.notional_usdt,2)+' U';
  $('pEntry').textContent=num(p.entry,2)+' / '+num(p.cost_price,2);
  $('pLiq').textContent=num(p.liq_px,2);
  $('pMargin').textContent=num(p.margin_usdt,4)+' U';
  $('pUpl').textContent=sgn(p.unrealized_pnl,2)+' U';
  $('pUpl').className='v num '+c3(p.unrealized_pnl||0);

  const w=s.wallet;
  if(w){
    $('wInit').textContent=num(w.initial_balance,2)+' U';
    $('wBal').textContent=num(w.balance,2)+' U';
    $('wPnl').textContent=sgn(w.realized_pnl,2)+' U';
    $('wPnl').className='v num '+c3(w.realized_pnl||0);
    $('wFees').textContent=num(w.fees_paid,3)+' / '+num(w.funding_paid,3)+' U';
    $('wBuyable').textContent=num(s.buyable_usdt,2)+' U';
  }
  if(c.equity!=null)push(s.ts,c.equity);
}

function showTab(w){
  $('tabTrades').className=w==='trades'?'on':''; $('tabRuns').className=w==='runs'?'on':'';
  $('tradesBox').style.display=w==='trades'?'':'none';
  $('runsBox').style.display=w==='runs'?'':'none';
}
async function loadTrades(){
  try{
    const rows=await(await fetch('/api/trades?limit=30')).json();
    $('tradesBox').querySelector('tbody').innerHTML=rows.map(t=>`<tr>
      <td class="faint num">${fmtTs(t.ts)}</td>
      <td><span class="side ${t.side||''}">${t.side==='long'?'多':t.side==='short'?'空':'平'}</span></td>
      <td class="num">${num(t.size_eth,4)}</td>
      <td class="num">${num(t.entry,1)}/${num(t.exit,1)}</td>
      <td class="num ${c3(t.pnl)}">${sgn(t.pnl,2)}</td></tr>`).join('');
  }catch(e){}
}
async function loadRuns(){
  try{
    const rows=await(await fetch('/api/runs')).json();
    $('runsBox').querySelector('tbody').innerHTML=rows.map(r=>`<tr>
      <td class="faint">${r.id}</td>
      <td>${r.mode==='paper'?'纸盘':r.mode==='live'?'实盘':'回测'}</td>
      <td class="num ${c3((r.final_equity||0)-(r.initial_balance||0))}">${r.final_equity!=null?num(r.final_equity/r.initial_balance,2)+'x':'-'}</td>
      <td class="dim">${({running:'运行中',guard:'结束',timeout:'超时',stopped:'停止',end_of_data:'数据完'}[r.status]||r.status)}</td></tr>`).join('');
  }catch(e){}
}
function connectWS(){
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onmessage=e=>render(JSON.parse(e.data));
  ws.onclose=()=>setTimeout(connectWS,3000);
  ws.onerror=()=>ws.close();
}
async function init(){
  let s0=null;
  try{s0=await(await fetch('/api/status')).json();}catch(e){}
  if(s0&&s0.challenge){initial=s0.challenge.initial_balance;guard=s0.challenge.guard_level;peak=s0.challenge.peak_equity;}
  try{
    initChart(); drawMarkLines();
    const hist=await(await fetch('/api/equity?limit=3000')).json();
    if(Array.isArray(hist)&&hist.length)chart.setOption({series:[{data:hist.map(p=>[p.ts*1000,p.equity])}]});
  }catch(e){console.warn(e);$('chart').innerHTML='<div class="empty">图表不可用</div>';}
  render(s0);
  loadTrades();loadRuns();
  connectWS();
  setInterval(loadTrades,30000);
  setInterval(loadRuns,30000);
  window.addEventListener('resize',()=>chart&&chart.resize());
}
init();
</script>
</body>
</html>
