<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YUNCS</title>
<script src="echarts.min.js"></script>
<style>
  /* 仿 OKX 客户端：白底、灰标签+黑数值、涨绿跌红、细分隔线 */
  :root{
    --bg:#fff; --line:#eaecef; --tx:#1a1a1a; --label:#7c828a;
    --green:#0ea97c; --red:#e5124b;
    --badge:#f0f1f2; --badge-long:#e6f7f1; --badge-short:#feecef;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",Inter,sans-serif}
  .n{font-variant-numeric:tabular-nums}
  .g{color:var(--green)}.r{color:var(--red)}.lb{color:var(--label)}

  .top{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);
       padding:12px 16px;display:flex;align-items:center;gap:8px}
  .top .name{font-weight:700;font-size:16px}
  .top .st{margin-left:auto;font-size:12px;color:var(--label)}
  .top .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px}

  .price{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  .price .p{font-size:32px;font-weight:700;letter-spacing:-.3px}
  .price .sub{color:var(--label);font-size:12px;margin-top:2px}

  section{padding:16px;border-bottom:1px solid var(--line)}
  h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}

  /* 徽章 */
  .bd{display:inline-flex;align-items:center;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600}
  .bd.gray{background:var(--badge);color:var(--tx)}
  .bd.long{background:var(--badge-long);color:var(--green)}
  .bd.short{background:var(--badge-short);color:var(--red)}

  /* 收益行：右侧绿色大数字 */
  .pnlrow{display:flex;align-items:center;gap:6px;margin-top:10px}
  .pnlrow .big{font-size:22px;font-weight:700;margin-left:auto}

  /* 三列网格：灰标签在上，黑数值在下 */
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px;margin-top:14px}
  .g3 .k{font-size:12px;color:var(--label)}
  .g3 .v{font-size:17px;font-weight:600;margin-top:4px}
  .g3 .v.s{font-size:13px;color:var(--label);font-weight:400;margin-top:2px}

  .big-eq{font-size:30px;font-weight:700;letter-spacing:-.3px}
  .tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:5px;margin-left:8px;vertical-align:4px}
  .tag.up{color:var(--green);background:var(--badge-long)}
  .tag.down{color:var(--red);background:var(--badge-short)}

  #chart{height:220px;width:100%;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;color:var(--label);font-weight:400;text-align:right;padding:6px 2px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:8px 2px;text-align:right;border-bottom:1px solid #f4f5f7}
  tr:last-child td{border-bottom:none}
  .sd{font-weight:600}
  .sd.long{color:var(--green)}.sd.short{color:var(--red)}
  .empty{color:var(--label);text-align:center;padding:30px 0}
</style>
</head>
<body>

<div class="top">
  <span class="name">YUNCS</span>
  <span class="st"><span class="d"></span><span id="st">纸盘 · 运行中</span>　<span id="round">第 1 轮</span></span>
</div>

<div class="price">
  <span class="p n" id="px">-</span>
  <div class="sub n" id="pxinfo">-</div>
</div>

<!-- 账户权益 -->
<section>
  <h3>账户权益 <span class="tag" id="mult" style="margin-left:8px">-</span></h3>
  <div class="big-eq n" id="equity" style="margin-top:8px">-</div>
  <div class="g3">
    <div><div class="k">可用资金</div><div class="v n" id="bal">-</div></div>
    <div><div class="k">占用保证金</div><div class="v n" id="mg">-</div></div>
    <div><div class="k">已实现盈亏</div><div class="v n" id="pnl">-</div></div>
    <div><div class="k">本轮峰值</div><div class="v n" id="peak">-</div></div>
    <div><div class="k">出局线</div><div class="v n r" id="guard">-</div></div>
    <div><div class="k">距出局线</div><div class="v n" id="room">-</div></div>
  </div>
</section>

<!-- 当前持仓：空仓时整卡隐藏 -->
<section id="posCard" style="display:none">
  <h3>当前持仓
    <span class="bd" id="posSideBd"></span>
    <span class="bd gray" id="levBd"></span>
  </h3>
  <div class="pnlrow">
    <span class="lb" style="font-size:13px">未实现盈亏</span>
    <span class="big n g" id="posPnl">--</span>
  </div>
  <div class="g3">
    <div><div class="k">持仓量 (USDT)</div><div class="v n" id="pSz">-</div></div>
    <div><div class="k">保证金</div><div class="v n" id="pMg">-</div></div>
    <div><div class="k">收益率</div><div class="v n" id="pRoR">-</div></div>
    <div><div class="k">开仓均价</div><div class="v n" id="pEp">-</div></div>
    <div><div class="k">标记价格</div><div class="v n" id="pMk">-</div></div>
    <div><div class="k">预估强平价</div><div class="v n r" id="pLq">-</div></div>
  </div>
</section>

<!-- 权益曲线 -->
<section>
  <h3>权益曲线</h3>
  <div id="chart"></div>
</section>

<!-- 最近成交 -->
<section>
  <h3>最近成交</h3>
  <table style="margin-top:8px"><thead><tr><th>时间</th><th>方向</th><th>金额</th><th>开仓价</th><th>盈亏</th></tr></thead><tbody id="trades"></tbody></table>
</section>

<!-- 周期历史 -->
<section style="border-bottom:none">
  <h3>周期历史</h3>
  <table style="margin-top:8px"><thead><tr><th>周期</th><th>开始</th><th>结果（USDT / 收益率）</th><th>状态</th></tr></thead><tbody id="runs"></tbody></table>
</section>

<script>
const $=i=>document.getElementById(i);
const n=(v,d=2)=>(v==null||isNaN(v))?'-':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const s2=(v,d=2)=>(v==null)?'-':(v>0?'+':'')+Number(v).toFixed(d);
const cl=v=>v>0?'g':v<0?'r':'';
const tm=t=>{const x=new Date(t*1000),p=a=>String(a).padStart(2,'0');return p(x.getHours())+':'+p(x.getMinutes())};
let ch=null,lastPx=0,lastTs=0;

function initChart(){
  if(typeof echarts==='undefined')throw 0;
  ch=echarts.init($('chart'));
  ch.setOption({animation:false,grid:{left:10,right:10,top:12,bottom:22,containLabel:true},
    xAxis:{type:'time',axisLabel:{color:'#7c828a',hideOverlap:true,
      formatter:v=>{const d=new Date(v),p=a=>String(a).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes())}},
      splitLine:{show:false},axisLine:{lineStyle:{color:'#eaecef'}}},
    yAxis:{type:'value',scale:true,axisLabel:{color:'#7c828a'},splitLine:{lineStyle:{color:'#f4f5f7'}}},
    tooltip:{trigger:'axis',valueFormatter:v=>v==null?'-':v.toFixed(2)},
    series:[{type:'line',showSymbol:false,smooth:true,lineStyle:{width:2,color:'#0ea97c'},areaStyle:{color:'rgba(14,169,124,.08)'},data:[]}]});
}
function push(ts,eq){
  if(ts===lastTs||!ch)return;lastTs=ts;
  ch.setOption({series:[{data:ch.getOption().series[0].data.concat([[ts*1000,eq]]).slice(-3000)}]},{lazyUpdate:true});
}

function render(s){
  if(!s)return;
  const c=s.challenge||{};
  const p=s.position||{};
  $('px').textContent=n(s.price,2);
  $('px').className='p n '+(s.price>lastPx?'g':s.price<lastPx?'r':'');
  lastPx=s.price;
  $('pxinfo').textContent='买 '+n(s.bid)+'　卖 '+n(s.ask)+'　资金费率 '+((s.funding_rate||0)*100).toFixed(4)+'%';
  const stTxt={running:'运行中',guard:'本轮结束',timeout:'超时',stopped:'已停止'}[c.status]||'';
  $('st').innerHTML='<span class="d"></span>'+(s.mode==='live'?'实盘':'纸盘')+' · '+stTxt;
  $('round').textContent='第 '+(c.round||'-')+' 周期';

  // 账户权益
  const w=s.wallet;
  $('equity').textContent=n(c.equity,2);
  const r0=c.initial_balance||1,pct=(c.equity-r0)/r0*100;
  $('mult').textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';
  $('mult').className='tag '+(pct>=0?'up':'down');
  if(w){
    $('bal').textContent=n(w.balance,2);
    $('pnl').textContent=s2(w.realized_pnl,2);
    $('pnl').className='v n '+cl(w.realized_pnl||0);
    $('mg').textContent=n(w.margin_locked,2);
  }
  $('peak').textContent=n(c.peak_equity,2);
  $('guard').textContent=n(c.guard_level,2);
  $('room').textContent=n((c.equity||0)-(c.guard_level||0),2)+' USDT';

  // 持仓：空仓整卡隐藏
  const open=p&&p.side&&p.size_eth;
  const card=$('posCard');
  const bd=$('posSideBd');
  if(open){
    card.style.display='';
    bd.textContent=p.side==='long'?'做多':'做空';
    bd.className='bd '+(p.side==='long'?'long':'short');
    $('levBd').textContent=(s.leverage||'-')+'x';
    $('pSz').textContent=n(p.notional_usdt,1);
    $('pMg').textContent=n(p.margin_usdt,2);
    $('pEp').textContent=n(p.entry,2);
    $('pMk').textContent=n(p.mark||s.price,2);
    $('pLq').textContent=n(p.liq_px,2);
    const upl=p.unrealized_pnl||0, mg=p.margin_usdt||0;
    const pn=$('posPnl');
    pn.textContent=s2(upl,2);
    pn.className='big n '+(upl>0?'g':upl<0?'r':'');
    const rr=mg>0?(upl/mg*100):0;
    $('pRoR').textContent=(rr>=0?'+':'')+rr.toFixed(2)+'%';
    $('pRoR').className='v n '+(rr>0?'g':rr<0?'r':'');
  }else{
    card.style.display='none';
  }

  if(c.equity!=null)push(s.ts,c.equity);
}
async function loadTrades(){
  try{
    const r=await(await fetch('/api/trades?limit=10')).json();
    $('trades').innerHTML=r.map(t=>`<tr>
      <td class="lb">${tm(t.ts)}</td>
      <td><span class="sd ${t.side||''}">${t.side==='long'?'开多':t.side==='short'?'开空':'平仓'}</span></td>
      <td class="n">${n(t.size_eth*t.entry,1)}</td>
      <td class="n">${n(t.entry,1)}</td>
      <td class="n ${cl(t.pnl)}">${s2(t.pnl,2)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">暂无成交</td></tr>';
  }catch(e){}
}
async function loadRuns(){
  try{
    const r=await(await fetch('/api/runs?limit=8')).json();
    $('runs').innerHTML=r.map(x=>{
      const t0=x.started?new Date(x.started*1000):null;
      const ds=t0?`${String(t0.getMonth()+1).padStart(2,'0')}-${String(t0.getDate()).padStart(2,'0')} ${String(t0.getHours()).padStart(2,'0')}:${String(t0.getMinutes()).padStart(2,'0')}`:'-';
      const d=(x.final_equity||0)-(x.initial_balance||0);
      const pc=x.initial_balance?(d/x.initial_balance*100):0;
      let st={running:'运行中',timeout:'超时',stopped:'手动停止',end_of_data:'数据未完'}[x.status]||x.status;
      if(x.status==='guard')st=(x.result||'').includes('锁利')?'锁利结束':'止损结束';
      const detail=(x.result&&x.status!=='running')?x.result:st;
      return `<tr title="${detail}">
      <td class="lb">${x.id}</td>
      <td class="lb">${ds}</td>
      <td class="n ${cl(d)}">${x.final_equity!=null?s2(d,2)+'（'+(pc>=0?'+':'')+pc.toFixed(1)+'%）':'-'}</td>
      <td>${st}</td></tr>`;
    }).join('');
  }catch(e){}
}
function ws(){
  const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  w.onmessage=e=>render(JSON.parse(e.data));
  w.onclose=()=>setTimeout(ws,3000);
  w.onerror=()=>w.close();
}
(async()=>{
  let s0=null;
  try{s0=await(await fetch('/api/status')).json()}catch(e){}
  try{
    initChart();
    const h=await(await fetch('/api/equity?limit=3000')).json();
    if(Array.isArray(h)&&h.length)ch.setOption({series:[{data:h.map(p=>[p.ts*1000,p.equity])}]});
  }catch(e){$('chart').innerHTML='<div class="empty">图表暂不可用</div>'}
  render(s0);loadTrades();loadRuns();ws();
  setInterval(loadTrades,20000);setInterval(loadRuns,20000);
  window.addEventListener('resize',()=>ch&&ch.resize());
})();
</script>
</body>
</html>
