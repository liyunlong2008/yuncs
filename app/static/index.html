<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YUNCS</title>
<script src="echarts.min.js"></script>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --line:#e8ebf0;
    --tx:#16181d; --dim:#6b7280; --faint:#9aa3af;
    --green:#00b578; --red:#f6483d; --blue:#165dff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .n{font-variant-numeric:tabular-nums}
  .top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;z-index:9}
  .top .name{font-weight:700}
  .top .st{margin-left:auto;font-size:12px;color:var(--dim)}
  .st .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px}
  .price{font-size:26px;font-weight:700;padding:8px 14px 4px;background:var(--card);border-bottom:1px solid var(--line)}
  .price .p{font-size:30px}
  .g{color:var(--green)}.r{color:var(--red)}.dim{color:var(--dim)}.faint{color:var(--faint)}
  main{max-width:520px;margin:0 auto;padding:10px 10px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .big{font-size:28px;font-weight:700}
  .tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:5px;vertical-align:3px;margin-left:6px}
  .tag.up{color:var(--green);background:rgba(0,181,120,.1)}
  .tag.down{color:var(--red);background:rgba(246,72,61,.1)}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;text-align:center}
  .kv div{background:#fafbfc;border:1px solid #f0f2f5;border-radius:8px;padding:6px 2px}
  .kv .k{display:block;font-size:11px;color:var(--faint)}
  .kv .v{display:block;font-size:14px;font-weight:600;margin-top:1px}
  .rows{margin-top:12px}
  .rows div{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid #f4f5f7}
  .rows div:last-child{border-bottom:none}
  .rows .k{color:var(--dim)}
  #chart{height:220px;width:100%}
  h3{font-size:13px;color:var(--dim);font-weight:500;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:7px 2px;text-align:right;border-bottom:1px solid #f4f5f7}
  td:first-child{text-align:left;color:var(--faint);font-size:13px}
  th{font-size:12px;color:var(--faint);font-weight:400;text-align:right;padding:4px 2px;border-bottom:1px solid var(--line)}
  th:first-child{text-align:left}
  .sd{font-weight:600}
  .sd.long{color:var(--green)}.sd.short{color:var(--red)}
</style>
</head>
<body>

<div class="top">
  <span class="name">YUNCS</span>
  <span class="st"><span class="d"></span><span id="st">纸盘 · 运行中</span>　<span id="round">第 1 轮</span></span>
</div>
<div class="price">
  <span class="p n" id="px">-</span>
  <div class="dim" style="font-size:12px" id="pxinfo">-</div>
</div>

<main>
  <div class="card">
    <span class="big n" id="equity">-</span><span class="tag" id="mult">-</span>
    <div class="kv">
      <div><span class="k">出局线</span><span class="v n r" id="guard">-</span></div>
      <div><span class="k">峰值</span><span class="v n" id="peak">-</span></div>
      <div><span class="k">回撤</span><span class="v n" id="dd">-</span></div>
      <div><span class="k">安全空间</span><span class="v n" id="room">-</span></div>
    </div>
    <div class="rows">
      <div><span class="k">可用余额</span><span class="n" id="bal">-</span></div>
      <div><span class="k">已实现盈亏</span><span class="n" id="pnl">-</span></div>
      <div><span class="k">手续费 / 资金费</span><span class="n" id="fees">-</span></div>
    </div>
  </div>

  <div class="card">
    <h3>当前持仓</h3>
    <div style="font-size:20px;font-weight:700" id="posLine">空仓</div>
    <div class="rows">
      <div><span class="k">数量 / 名义价值</span><span class="n" id="pSz">-</span></div>
      <div><span class="k">开仓价 / 成本价</span><span class="n" id="pEp">-</span></div>
      <div><span class="k">强平价</span><span class="n r" id="pLq">-</span></div>
      <div><span class="k">未实现盈亏</span><span class="n" id="pUp">-</span></div>
    </div>
  </div>

  <div class="card">
    <h3>权益曲线</h3>
    <div id="chart"></div>
  </div>

  <div class="card">
    <h3>最近成交</h3>
    <table><thead><tr><th>时间</th><th>方向</th><th>数量</th><th>开仓价</th><th>盈亏</th></tr></thead><tbody id="trades"></tbody></table>
  </div>

  <div class="card">
    <h3>轮次</h3>
    <table><thead><tr><th>轮次</th><th>结束倍数</th><th>盈亏</th><th>状态</th></tr></thead><tbody id="runs"></tbody></table>
  </div>
</main>

<script>
const $=i=>document.getElementById(i);
const n=(v,d=2)=>(v==null||isNaN(v))?'-':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const s2=(v,d=2)=>(v==null)?'-':(v>0?'+':'')+Number(v).toFixed(d);
const cl=v=>v>0?'g':v<0?'r':'';
const tm=t=>{const x=new Date(t*1000),p=a=>String(a).padStart(2,'0');return p(x.getHours())+':'+p(x.getMinutes())};
let ch=null,lastPx=0,lastTs=0;

function initChart(){
  if(typeof echarts==='undefined')throw 0;
  ch=echarts.init($('chart'));
  ch.setOption({animation:false,grid:{left:10,right:10,top:12,bottom:22,containLabel:true},
    xAxis:{type:'time',axisLabel:{color:'#9aa3af',hideOverlap:true,
      formatter:v=>{const d=new Date(v),p=a=>String(a).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes())}},
      splitLine:{show:false},axisLine:{lineStyle:{color:'#e8ebf0'}}},
    yAxis:{type:'value',scale:true,axisLabel:{color:'#9aa3af'},splitLine:{lineStyle:{color:'#f4f5f7'}}},
    tooltip:{trigger:'axis',valueFormatter:v=>v==null?'-':v.toFixed(2)},
    series:[{type:'line',showSymbol:false,smooth:true,lineStyle:{width:2,color:'#00b578'},areaStyle:{color:'rgba(0,181,120,.08)'},data:[]}]});
}
function push(ts,eq){
  if(ts===lastTs||!ch)return;lastTs=ts;
  ch.setOption({series:[{data:ch.getOption().series[0].data.concat([[ts*1000,eq]]).slice(-3000)}]},{lazyUpdate:true});
}

function render(s){
  if(!s)return;
  const c=s.challenge||{};
  $('px').textContent=n(s.price,2);
  $('px').className='p n '+(s.price>lastPx?'g':s.price<lastPx?'r':'');
  lastPx=s.price;
  $('pxinfo').textContent='买 '+n(s.bid)+' · 卖 '+n(s.ask)+' · 资金费率 '+((s.funding_rate||0)*100).toFixed(4)+'%';
  const st={running:'运行中',guard:'本轮结束',timeout:'超时',stopped:'已停止'}[c.status]||'';
  $('st').innerHTML='<span class="d"></span>'+(s.mode==='live'?'实盘':'纸盘')+' · '+st;
  $('round').textContent='第 '+(c.round||'-')+' 轮';
  $('equity').textContent=n(c.equity,2);
  $('mult').textContent=n(c.multiple,2)+' 倍';
  $('mult').className='tag '+(c.equity>=(c.initial_balance||0)?'up':'down');
  $('guard').textContent=n(c.guard_level,2);
  $('peak').textContent=n(c.peak_equity,2);
  $('dd').textContent=n(c.drawdown_pct,1)+'%';
  $('dd').className='v n '+((c.drawdown_pct||0)>(c.tolerance_pct||30)*0.7?'r':'');
  $('room').textContent=n((c.equity||0)-(c.guard_level||0),2);
  const p=s.position||{},w=s.wallet;
  if(w){
    $('bal').textContent=n(w.balance,2)+' USDT';
    $('pnl').textContent=s2(w.realized_pnl,2)+' USDT';
    $('pnl').className='n '+cl(w.realized_pnl||0);
    $('fees').textContent=n(w.fees_paid,3)+' / '+n(w.funding_paid,3)+' USDT';
  }
  const open=p&&p.side&&p.size_eth;
  const line=$('posLine');
  if(open){
    const t=p.side==='long'?'多仓':'空仓';
    line.textContent=t+' '+n(p.size_eth,4)+' ETH';
    line.style.color=p.side==='long'?'var(--green)':'var(--red)';
  }else{line.textContent='空仓';line.style.color='var(--faint)';}
  $('pSz').textContent=(open?n(p.size_eth,4)+' ETH':'无')+' / '+n(p.notional_usdt,2)+' USDT';
  $('pEp').textContent=open?n(p.entry,2)+' / '+n(p.cost_price,2):'-';
  $('pLq').textContent=open?n(p.liq_px,2):'-';
  $('pUp').textContent=open?s2(p.unrealized_pnl,2)+' USDT':'-';
  $('pUp').className='n '+(open?(p.unrealized_pnl>0?'g':p.unrealized_pnl<0?'r':''):'');
  if(c.equity!=null)push(s.ts,c.equity);
}
async function loadTrades(){
  try{
    const r=await(await fetch('/api/trades?limit=10')).json();
    $('trades').innerHTML=r.map(t=>`<tr>
      <td>${tm(t.ts)}</td>
      <td><span class="sd ${t.side||''}">${t.side==='long'?'开多':t.side==='short'?'开空':'平仓'}</span></td>
      <td class="n">${n(t.size_eth,4)}</td>
      <td class="n">${n(t.entry,1)}</td>
      <td class="n ${cl(t.pnl)}">${s2(t.pnl,2)}</td></tr>`).join('')||'<tr><td class="faint">暂无成交</td></tr>';
  }catch(e){}
}
async function loadRuns(){
  try{
    const r=await(await fetch('/api/runs?limit=6')).json();
    $('runs').innerHTML=r.map(x=>`<tr>
      <td>${x.id}</td>
      <td class="n">${x.final_equity!=null?n(x.final_equity/x.initial_balance,2)+' 倍':'-'}</td>
      <td class="n ${cl((x.final_equity||0)-(x.initial_balance||0))}">${x.final_equity!=null?s2(x.final_equity-x.initial_balance,2):'-'}</td>
      <td>${({running:'运行中',guard:'结束',timeout:'超时',stopped:'停止',end_of_data:'数据完'}[x.status]||x.status)}</td></tr>`).join('');
  }catch(e){}
}
function ws(){
  const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  w.onmessage=e=>render(JSON.parse(e.data));
  w.onclose=()=>setTimeout(ws,3000);
  w.onerror=()=>w.close();
}
(async()=>{
  let s0=null;
  try{s0=await(await fetch('/api/status')).json()}catch(e){}
  try{
    initChart();
    const h=await(await fetch('/api/equity?limit=3000')).json();
    if(Array.isArray(h)&&h.length)ch.setOption({series:[{data:h.map(p=>[p.ts*1000,p.equity])}]});
  }catch(e){$('chart').innerHTML='<div style="color:#9aa3af;text-align:center;padding-top:80px">图表暂不可用</div>'}
  render(s0);loadTrades();loadRuns();ws();
  setInterval(loadTrades,20000);setInterval(loadRuns,20000);
  window.addEventListener('resize',()=>ch&&ch.resize());
})();
</script>
</body>
</html>
