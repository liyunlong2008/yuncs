[project]
name = "yuncs"
version = "0.1.0"
description = "OKX ETH-USDT-SWAP 小资金挑战赛量化机器人（盈利目标+最大回撤+时长）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.76",
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "uvicorn[standard]>=0.52.4",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "aiohttp-socks>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
